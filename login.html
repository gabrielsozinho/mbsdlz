<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./style/login.css">

    <script type="module" src="./script/login.js"></script>
    <script type="module" src="./script/auth.js"></script>
    <title>Login</title>
</head>

<body>

    <div class="login-container">

        <h1>Login</h1>

        <form id="loginForm">

            <input
                type="email"
                id="username"
                placeholder="E-mail"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Senha"
                autocomplete="current-password"
                required
            >

            <button type="submit">Entrar</button>

        </form>

    </div>

</body>

</html>
