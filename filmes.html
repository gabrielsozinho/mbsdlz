<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/global.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#fbf3ee">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nós">
    <script type="module" src="./script/auth.js"></script>
    <script type="module" src="./script/app.js"></script>
    <link rel="stylesheet" href="./style/filmes.css">
    <script type="module" src="./script/filmes.js"></script>
    <title>Filmes · Nós</title>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow rise" style="--i:0">Sessão da noite</p>
            <h1 class="page-title rise" style="--i:1">Nossos <em>filmes</em></h1>
            <p class="page-lead rise" style="--i:2">Pipoca pronta. O que já vimos e o que ainda falta assistir de mãos dadas.</p>
        </header>

        <div class="tabs rise" style="--i:3" role="tablist" id="abasFilmes">
            <span class="tabs-indicator"></span>
            <button class="tab" role="tab" aria-selected="true" data-filtro="todos">Todos</button>
            <button class="tab" role="tab" aria-selected="false" data-filtro="vistos">Vistos</button>
            <button class="tab" role="tab" aria-selected="false" data-filtro="aver">Pra ver</button>
        </div>

        <section class="filmes" id="filmes"></section>
    </main>
</body>
</html>
