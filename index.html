<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/index.css">
    <script src="./script/index.js"></script>
    <script type="module" src="script/auth.js"></script>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#e8b4b8">

    <!-- Compatibilidade com iPhone -->
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nós">
    <!-- Compatibilidade com Android -->
    <meta name="mobile-web-app-capable" content="yes">

    
    <title>MBS ♥ DLZ</title>
</head>
<body>
    <header>
        <div class="menu"></div>
    </header>

    <div class="container">
        <div class="content">
            <h1>Nós ♥</h1>
            <p>Frase fofa...</p>
        </div>
        <div class="contagem">
            Estamos juntos há <span id="dias">0</span> dias
            <div class="contagensMenor">
                <div class="contagemMenor">
                    <h4 id="diasVista" class="contagemTextoMenor">00</h4>
                    <p>Desde o primeiro dia</p>
                </div>
                <div class="contagemMenor">
                    <h4 id="diasEncontro" class="contagemTextoMenor">00</h4>
                    <p>Desde o primeiro encontro</p>
                </div>
                <div class="contagemMenor">
                    <h4 id="diasBeijo" class="contagemTextoMenor">00</h4>
                    <p>Desde o nosso primeiro beijo</p>
                </div>
            </div>
        </div>
    </div>

    <div class="bottomNav">
        <div class="bottomNavItem">
            <a href="./index.html">
                <img src="assets/home.svg" alt="Inicio">
                
            </a>
        </div>
        <div class="bottomNavItem">
            <a href="./historia.html">
                <img src="assets/historia.svg" alt="Historia">
            </a>
        </div>
        <div class="bottomNavItem">
            <a href="./fotos.html">
                <img src="assets/fotos.svg" alt="Fotos">
            </a>
        </div>
        <div class="bottomNavItem" id="menu">
            <img src="assets/menu.svg" alt="Menu">
        </div>

    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./service-worker.js")
                .then(() => console.log("Aplicativo pronto!"))
                .catch((error) => {
                    console.error("Erro ao registrar o Service Worker:", error);
                });
        });
    }
    </script>
</body>
</html>
