<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" href="./style/global.css" />
    <link rel="stylesheet" href="./style/mensagens.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./script/mensagens.js"></script>
    <script type="module" src="./script/auth.js"></script>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#e8b4b8" />
    <link rel="icon" type="image/x-icon" href="/assets/icon-192.png" />
    <title>Mensagens</title>
  </head>

  <body>
    <div class="coracoes">
        <div class="coracao">&hearts;</div>
        <div class="coracao">&hearts;</div>
        <div class="coracao">&hearts;</div>
        <div class="coracao">&hearts;</div>
        <div class="coracao">&hearts;</div>
        <div class="coracao">&hearts;</div>
        <div class="coracao">&hearts;</div>
        <div class="coracao">&hearts;</div>
    </div>
    <header>
        <div class="headerTexto">
            <h1 class="titulo">Nossas mensagens♥</h1>
            <p class="subtitulo">Um cantinho para escrever cartas um para o outro.</p>
        </div>
    </header>

    <main>
      <section class="secao">
        <div class="titulo-secao">
          <div>
            <p class="label">PARA OS MOMENTOS</p>
            <h2>Abra quando...</h2>
          </div>
        </div>

        <div id="cartasOpenWhen" class="grid-cartas">
          <p class="carregando">Carregando cartas...</p>
        </div>
      </section>

      <section class="secao">
        <div class="titulo-secao">
          <div>
            <p class="label">PARA O FUTURO</p>
            <h2>Cápsulas do tempo</h2>
          </div>
        </div>

        <div id="cartasTimeCapsule" class="grid-cartas">
          <p class="carregando">Carregando cartas...</p>
        </div>
      </section>

      <button id="btnNovaCarta" class="btn-nova-carta">
        <span>＋</span>Nova carta
      </button>

      <div id="modalNovaCarta" class="modal escondido">
        <div class="modal-conteudo">
          <button id="fecharModal" class="fechar-modal">×</button>
          <p class="label">UMA NOVA MEMÓRIA</p>
          <h2>Escrever carta 💌</h2>
            <form id="formCarta">
                <label for="titulo">Título</label>
                <input type="text" id="titulo"  placeholder="Ex.: Abra quando estiver triste" required/>
                <label>Para quem?</label>
                <div class="opcoes">
                <label class="opcao">
                    <input type="radio" name="destinatario" value="gabriel" checked />
                    <span>Gabriel</span>
                </label>

                <label class="opcao">
                    <input type="radio" name="destinatario" value="maria" />
                    <span>Maria</span>
                </label>
                </div>

                <label>Tipo</label>

                <div class="opcoes">
                    <label class="opcao">
                        <input type="radio" name="tipo" value="open_when" checked />
                        <span>Abra quando...</span>
                    </label>

                    <label class="opcao">
                        <input type="radio" name="tipo" value="time_capsule" />
                        <span>Cápsula do tempo</span>
                    </label>
                </div>

                <div id="campoData" class="campo-data escondido">
                    <label for="dataAbertura"> Data de abertura </label>
                    <input type="date" id="dataAbertura" />
                </div>

                <label for="conteudo"> Sua carta </label>

                <textarea id="conteudo" placeholder="Escreva aqui tudo aquilo que você quer guardar..." rows="9" required></textarea>

                <button type="submit" class="btn-salvar">Guardar carta ❤️</button>
            </form>
            </div>
        </div>


        <div id="modalLeitura" class="modal escondido" >
            <div class="modal-conteudo leitura">
                <button id="fecharLeitura" class="fechar-modal">×</button>
                <p class="label">UMA CARTA PARA VOCÊ</p>
                <h2 id="tituloLeitura"></h2>
                <div id="conteudoLeitura" class="texto-carta"></div>
            </div>
        </div>


    </main>

    <div id="navbar"></div>
    <script src="./script/navbar.js"></script>
  </body>
</html>
