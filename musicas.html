<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/global.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#fbf3ee">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nós">
    <script type="module" src="./script/auth.js"></script>
    <script type="module" src="./script/app.js"></script>
    <link rel="stylesheet" href="./style/musicas.css">
    <script type="module" src="./script/musicas.js"></script>
    <title>Músicas · Nós</title>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow rise" style="--i:0">Lado A · Lado B</p>
            <h1 class="page-title rise" style="--i:1">Nossa <em>trilha</em></h1>
            <p class="page-lead rise" style="--i:2">As músicas que contam a nossa história melhor do que qualquer palavra.</p>
        </header>

        <section class="toca-discos card rise" style="--i:3">
            <div class="vinil" id="vinil" aria-hidden="true">
                <div class="vinil-rotulo">♥</div>
            </div>
            <div class="agora">
                <p class="agora-label">Tocando agora</p>
                <p class="agora-titulo" id="agoraTitulo">—</p>
                <p class="agora-artista" id="agoraArtista"></p>
                <div class="equalizador" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            </div>
        </section>

        <ol class="faixas" id="faixas"></ol>
    </main>
</body>
</html>
