<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/global.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#fbf3ee">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nós">
    <script type="module" src="./script/auth.js"></script>
    <script type="module" src="./script/app.js"></script>
    <link rel="stylesheet" href="./style/dates.css">
    <script type="module" src="./script/dates.js"></script>
    <title>Dates · Nós</title>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow rise" style="--i:0">Agenda a dois</p>
            <h1 class="page-title rise" style="--i:1">Nossos <em>dates</em></h1>
            <p class="page-lead rise" style="--i:2">Os que já vivemos e os que estão esperando por nós.</p>
        </header>

        <section class="sorteio card rise" style="--i:3">
            <p class="sorteio-label">Sem ideia pro próximo?</p>
            <p class="sorteio-resultado" id="sorteioResultado">Deixa o destino escolher</p>
            <button class="btn" id="sortear">Sortear um date</button>
        </section>

        <div class="progresso-dates reveal">
            <p><strong id="datesFeitos">0</strong> de <span id="datesTotal">0</span> dates vividos</p>
            <div class="progresso"><div class="progresso-barra" id="datesBarra"></div></div>
        </div>

        <section class="dates" id="dates"></section>
    </main>
</body>
</html>
