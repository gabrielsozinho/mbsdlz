<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <script type="module" src="./script/dates.js"></script>
    <script type="module" src="script/auth.js"></script>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#e8b4b8">
    <link rel="icon" type="image/x-icon" href="/assets/icon-192.png">
    <!-- Compatibilidade com iPhone -->
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nós">
    <!-- Compatibilidade com Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <title>Nossos Dates 💕</title>

    <link rel="stylesheet" href="./style/dates.css">
    <link rel="stylesheet" href="./style/global.css">
</head>

<body>

    <main class="dates-page">

        <header class="dates-header">
            <h1>Nossos Dates 💕</h1>
            <p id="dateCounter">Carregando...</p>
        </header>

        <button id="randomDateBtn" class="random-button">
            🎲 Escolher um date aleatório
        </button>

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Pesquisar dates..."
            >

            <div class="filter-buttons">
                <button class="filter active" data-filter="all">
                    Todos
                </button>

                <button class="filter" data-filter="planned">
                    A fazer
                </button>

                <button class="filter" data-filter="done">
                    Feitos
                </button>
            </div>

            <select id="sortSelect">
                <option value="title">Alfabética</option>
                <option value="category">Categoria</option>
                <option value="status">Status</option>
                <option value="newest">Mais recente</option>
                <option value="oldest">Mais antigo</option>
            </select>

        </div>
        <section class="add-date-section">

    <button id="toggleAddDate" class="add-date-toggle">
        ＋ Add a new date
    </button>

    <form id="addDateForm" class="add-date-form hidden">

        <h2>Novo date</h2>

        <input
            type="text"
            id="newTitle"
            placeholder="Ideia de date"
            required
        >

        <textarea
            id="newDescription"
            placeholder="Descreva a experiência..."
            rows="3"
        ></textarea>
        <input
            type="text"
            id="newCategory"
            placeholder="Categoria"
        >
        <input
            type="text"
            id="newLocation"
            placeholder="Locatlização (opcional)"
        >
        <div class="form-buttons">
            <button
                type="button"
                id="cancelAddDate"
                class="cancel-button"
            >
                Cancelar
            </button>
            <button
                type="submit"
                class="save-button"
            >
                Salvar date
            </button>
        </div>
    </form>

</section>
        <section id="datesList" class="dates-list">
            <!-- Dates will be inserted here -->
        </section>
        <div id="navbar"></div>
    </main>
    
    <script type="module" src="./script/navbar.js"></script>
    <script type="module" src="./script/dates.js"></script>

</body>
</html>
