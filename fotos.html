<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" href="./style/global.css" />
    <link rel="stylesheet" href="./style/fotos.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./script/fotos.js"></script>
    <script type="module" src="./script/auth.js"></script>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#e8b4b8" />
    <link rel="icon" type="image/x-icon" href="/assets/icon-192.png" />
    <title>Fotos</title>
  </head>

  <body>
    <div class="coracoes">
      <div class="coracao">&hearts;</div>
      <div class="coracao">&hearts;</div>
      <div class="coracao">&hearts;</div>
      <div class="coracao">&hearts;</div>
      <div class="coracao">&hearts;</div>
      <div class="coracao">&hearts;</div>
      <div class="coracao">&hearts;</div>
      <div class="coracao">&hearts;</div>
    </div>
    <header>
      <div class="headerTexto">
        <h1 class="titulo">Nossas fotos♥</h1>
        <p class="subtitulo">Um cantinho para guardar momentos especiais.</p>
      </div>
    </header>

    <main>
      <div class="containerAdicionar">
        <button id="btnAdicionar" class="btn-adicionar">
          + Adicionar foto
        </button>
      </div>

      <section class="secao">
        <div id="fotos" class="grid-fotos">
          <p class="carregando">Carregando fotos...</p>
        </div>
      </section>

      <div id="modalAdicionar" class="modal">
        <div class="modal-content">
          <button id="fecharModal" class="fecharModal">×</button>
          <h2>Adicionar uma memória ♡</h2>
          <label
            for="inputFoto"
            id="fotoSeletor"
            class="file-label foto-seletor"
            >Escolher foto <img id="previewFoto" class="preview-foto"
          /></label>
          <input
            type="file"
            id="inputFoto"
            accept="image/*"
            capture="environment"
          />
          <textarea
            id="inputDescricao"
            placeholder="Conte um pouquinho sobre essa foto..."
          ></textarea>
          <button id="btnEnviar" class="btn-enviar">Adicionar foto</button>
        </div>
      </div>

      <!-- MODAL DA FOTO -->
      <div id="modalFoto" class="modal modal-foto">
        <div class="modal-foto-content">
          <button id="fecharModalFoto" class="fecharModal" aria-label="Fechar">
            ×
          </button>
          <img id="fotoModalImagem" src="" alt="" />
          <div class="foto-modal-info">
            <p id="fotoModalDescricao"></p>
            <button id="btnApagarFoto" class="btn-apagar">Apagar foto</button>
          </div>
        </div>
      </div>

      <div id="navbar"></div>
      <script type="module" src="./script/navbar.js"></script>
    </main>
  </body>
</html>
