<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/global.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#fbf3ee">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nós">
    <script type="module" src="./script/auth.js"></script>
    <script type="module" src="./script/app.js"></script>
    <link rel="stylesheet" href="./style/fotos.css">
    <script type="module" src="./script/fotos.js"></script>
    <title>Fotos · Nós</title>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow rise" style="--i:0">Álbum</p>
            <h1 class="page-title rise" style="--i:1">Nossos <em>momentos</em></h1>
            <p class="page-lead rise" style="--i:2">Toque em uma foto para ver de pertinho.</p>
        </header>

        <section class="mural" id="mural"></section>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
        <button class="lightbox-fechar" id="fecharLightbox" aria-label="Fechar">×</button>
        <button class="lightbox-nav anterior" id="fotoAnterior" aria-label="Foto anterior">‹</button>
        <figure class="lightbox-polaroid" id="lightboxConteudo"></figure>
        <button class="lightbox-nav proxima" id="fotoProxima" aria-label="Próxima foto">›</button>
    </div>
</body>
</html>
