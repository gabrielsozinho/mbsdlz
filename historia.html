<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow rise" style="--i:0">Capítulo por capítulo</p>
            <h1 class="page-title rise" style="--i:1">Nossa <em>história</em></h1>
            <p class="page-lead rise" style="--i:2">Os dias que viraram marcos. Cada ponto dessa linha é um pedacinho de nós.</p>
        </header>

        <ol class="timeline" id="timeline"></ol>

        <section class="historia-fim reveal">
            <p class="script">continua...</p>
            <p>O melhor capítulo é sempre o próximo.</p>
        </section>
    </main>
